<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ImageResizerJ</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f7;
  --card: #ffffff;
  --header-material: rgba(255, 255, 255, 0.82);
  --text: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #86868b;
  --hairline: rgba(0, 0, 0, 0.09);
  --win-border: rgba(0, 0, 0, 0.12);
  --row-hover: rgba(0, 0, 0, 0.025);
  --accent: #007aff;
  --accent-soft: rgba(0, 122, 255, 0.09);
  --accent-border: rgba(0, 122, 255, 0.2);
  --green: #34c759;
  --danger-soft: rgba(255, 59, 48, 0.14);
  --danger: #ff3b30;
  --fill: rgba(120, 120, 128, 0.16);
  --control: rgba(120, 120, 128, 0.12);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 14px rgba(0, 0, 0, 0.04);
  --win-shadow: 0 12px 32px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.08);
  --toast-bg: rgba(29, 29, 31, 0.88);
  --toast-text: #ffffff;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
}

:root[data-theme="light"] { color-scheme: light; }

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f11;
  --card: #1c1c1e;
  --header-material: rgba(28, 28, 30, 0.86);
  --text: #f5f5f7;
  --text-2: #a1a1a6;
  --text-3: #98989d;
  --hairline: rgba(255, 255, 255, 0.11);
  --win-border: rgba(255, 255, 255, 0.15);
  --row-hover: rgba(255, 255, 255, 0.045);
  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, 0.16);
  --accent-border: rgba(10, 132, 255, 0.28);
  --green: #30d158;
  --danger-soft: rgba(255, 69, 58, 0.22);
  --danger: #ff453a;
  --fill: rgba(120, 120, 128, 0.24);
  --control: rgba(120, 120, 128, 0.24);
  --shadow: none;
  --win-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
  --toast-bg: rgba(44, 44, 46, 0.94);
  --toast-text: #f5f5f7;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f0f11;
    --card: #1c1c1e;
    --header-material: rgba(28, 28, 30, 0.86);
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --text-3: #98989d;
    --hairline: rgba(255, 255, 255, 0.11);
    --win-border: rgba(255, 255, 255, 0.15);
    --row-hover: rgba(255, 255, 255, 0.045);
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.16);
    --accent-border: rgba(10, 132, 255, 0.28);
    --green: #30d158;
    --danger-soft: rgba(255, 69, 58, 0.22);
    --danger: #ff453a;
    --fill: rgba(120, 120, 128, 0.24);
    --control: rgba(120, 120, 128, 0.24);
    --shadow: none;
    --win-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
    --toast-bg: rgba(44, 44, 46, 0.94);
    --toast-text: #f5f5f7;
  }
}

* { box-sizing: border-box; user-select: none; }
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: var(--font);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 8px; height: 8px; background: transparent; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-button { display: none; }
::-webkit-scrollbar-thumb {
  background-color: rgba(120, 120, 128, 0.35);
  border-radius: 8px;
  border: 2px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background-color: rgba(120, 120, 128, 0.55); }

.app-wrap {
  width: 100%; height: 100%;
  padding: 0;
  display: flex;
}
.content-inner {
  display: flow-root;
}

.window-shell {
  position: relative;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  border-radius: 16px;
  background: var(--bg);
  border: 1px solid var(--win-border);
  overflow: hidden;
  transition: background-color 0.25s ease, border-color 0.25s ease;
}

.titlebar {
  flex-shrink: 0;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 5px 0 12px;
  background: var(--header-material);
  border-bottom: 1px solid var(--hairline);
  cursor: default;
  transition: background-color 0.25s ease;
}
.title-left {
  display: flex; align-items: center; gap: 8px;
  min-width: 0;
}
.app-icon {
  width: 21px;
  height: 21px;
  flex-shrink: 0;
  display: block;
}
.title-text {
  display: flex; align-items: baseline; gap: 7px; min-width: 0;
}
.title-name {
  font-size: 13.5px; font-weight: 700; letter-spacing: -0.2px;
  color: var(--text);
}
.title-sub {
  font-size: 11.5px; color: var(--text-3);
}

.win-actions { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
.btn-win {
  width: 34px; height: 30px;
  border: none; border-radius: 8px;
  background: transparent; color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
}
.btn-win:hover { background: var(--fill); color: var(--text); }
.btn-win.close:hover { background: var(--danger-soft); color: var(--danger); }
.btn-win:active { transform: scale(0.9); }
.btn-win svg {
  width: 15px; height: 15px; fill: none;
  stroke: currentColor; stroke-width: 2.1; stroke-linecap: round;
}

.window-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 16px 16px;
}

.hint-banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 10px 10px 12px;
  margin-bottom: 14px;
  border-radius: 12px;
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
}
.hint-banner[hidden] { display: none; }
.hint-icon {
  width: 18px; height: 18px;
  margin-top: 1px;
  flex-shrink: 0;
  color: var(--accent);
}
.hint-icon svg {
  width: 18px; height: 18px; fill: none;
  stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.hint-text {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 2px;
}
.hint-title {
  font-size: 12.5px; font-weight: 600; color: var(--text);
}
.hint-body {
  font-size: 11.5px; line-height: 1.38; color: var(--text-2);
}
.hint-close {
  width: 26px; height: 26px;
  flex-shrink: 0;
  border: none; border-radius: 7px;
  background: transparent; color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
}
.hint-close:hover { background: var(--fill); color: var(--text); }
.hint-close:active { transform: scale(0.9); }
.hint-close svg {
  width: 13px; height: 13px; fill: none;
  stroke: currentColor; stroke-width: 2.1; stroke-linecap: round;
}

.group { margin-top: 14px; }
.content-inner > .group:first-of-type { margin-top: 0; }
.group-title {
  margin: 0 0 6px 12px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-3);
}
.card {
  background: var(--card);
  border-radius: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: background-color 0.25s ease, box-shadow 0.25s ease;
}

.row {
  position: relative;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 46px; padding: 9px 14px;
  transition: background-color 0.15s ease, opacity 0.2s ease;
}
.row:hover { background: var(--row-hover); }
.row:not(:first-child)::before {
  content: ""; position: absolute; top: 0; left: 14px; right: 0;
  height: 1px; background: var(--hairline);
}
.row-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.row-title { font-size: 13.5px; font-weight: 500; }
.row-caption { font-size: 11.5px; color: var(--text-3); }
.row-stack { flex-direction: column; align-items: stretch; gap: 8px; }
.row-head { display: flex; justify-content: space-between; align-items: baseline; width: 100%; }
.row-value { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.row-disabled { opacity: 0.42; pointer-events: none; }

.segmented {
  position: relative; display: flex; width: 100%;
  padding: 2px; border-radius: 9px; background: var(--control);
  transition: background-color 0.25s ease;
}
.segmented-compact {
  width: 176px;
  flex-shrink: 0;
}
.segmented button {
  position: relative; z-index: 1; flex: 1;
  padding: 6px 0; border: none; border-radius: 7px;
  background: transparent; font-family: inherit;
  font-size: 12.5px; font-weight: 600; color: var(--text-2);
  cursor: pointer; transition: color 0.2s;
}
.segmented button[aria-checked="true"] { color: var(--text); }
.segmented-thumb {
  position: absolute; top: 2px; left: 2px;
  width: calc((100% - 4px) / 4); height: calc(100% - 4px);
  border-radius: 7px; background: var(--card);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
  transition: transform 0.26s cubic-bezier(0.34, 1.4, 0.64, 1), background-color 0.25s ease;
}
.segmented-3 .segmented-thumb { width: calc((100% - 4px) / 3); }

.stepper {
  display: flex; align-items: center;
  padding: 2px; border-radius: 9px; background: var(--control);
  transition: background-color 0.25s ease;
}
.step-btn {
  width: 28px; height: 28px; border: none; border-radius: 7px;
  background: transparent; color: var(--accent);
  font-size: 17px; line-height: 1; cursor: pointer;
  transition: background-color 0.15s, transform 0.1s;
}
.step-btn:hover { background: var(--fill); }
.step-btn:active { transform: scale(0.88); }
.step-value { display: flex; align-items: baseline; justify-content: center; gap: 3px; padding: 0 5px; }
#width-input {
  width: 50px; border: none; background: transparent; text-align: center;
  font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text);
  outline: none; user-select: text; font-variant-numeric: tabular-nums;
}
#width-input::-webkit-outer-spin-button,
#width-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.step-unit { font-size: 11.5px; color: var(--text-2); }

input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
  border-radius: 2px; outline: none; cursor: pointer;
  background: linear-gradient(to right,
    var(--accent) var(--fill-pos, 80%),
    var(--fill) var(--fill-pos, 80%));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
  background: #ffffff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
  transition: transform 0.15s ease;
}
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.14); }

.switch { position: relative; display: inline-block; flex-shrink: 0; cursor: pointer; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .track {
  display: block; position: relative; width: 46px; height: 28px;
  border-radius: 14px; background: var(--fill);
  transition: background-color 0.25s ease;
}
.switch .thumb {
  position: absolute; top: 2px; left: 2px; width: 24px; height: 24px;
  border-radius: 50%; background: #ffffff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.16), 0 1px 1px rgba(0, 0, 0, 0.14);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.switch input:checked + .track { background: var(--green); }
.switch input:checked + .track .thumb { transform: translateX(18px); }

.footnote {
  margin: 12px 4px 0; text-align: center; font-size: 11px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  user-select: text;
}
.autosave-toast {
  position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 12px);
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 13px; border-radius: 999px;
  background: var(--toast-bg); color: var(--toast-text);
  font-size: 12.5px; font-weight: 500;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
}
.autosave-toast.visible { opacity: 1; transform: translate(-50%, 0); }
.autosave-toast svg {
  width: 13px; height: 13px; fill: none; stroke: var(--green);
  stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round;
}
</style>
</head>
<body>
<div class="app-wrap">
  <div class="window-shell">
    <header class="titlebar" id="titlebar">
      <div class="title-left">
        <div class="app-icon">
          <svg class="app-icon" viewBox="0 0 100 100" aria-hidden="true">
            <rect x="19" y="29" width="75" height="59" rx="9" fill="#e65100" />
            <rect x="6" y="16" width="75" height="59" rx="9" fill="#f57c00" />
            <circle cx="62.5" cy="33.5" r="6.5" fill="#fff6c2" />
            <polygon points="16.5,65 35.5,37 54.5,65" fill="#842400" />
            <polygon points="45.5,65 58,49 70.5,65" fill="#bf3b00" />
          </svg>
        </div>
        <div class="title-text">
          <span class="title-name">ImageResizerJ</span>
          <span class="title-sub" data-i18n="settings"></span>
        </div>
      </div>
      <div class="win-actions">
        <button type="button" class="btn-win" id="btn-min" data-i18n-title="minimize">
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" /></svg>
        </button>
        <button type="button" class="btn-win close" id="btn-close" data-i18n-title="close">
          <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18" /><line x1="18" y1="6" x2="6" y2="18" /></svg>
        </button>
      </div>
    </header>

    <main class="window-body" id="window-body">
      <div class="content-inner" id="content-inner">
      <div class="hint-banner" id="hint-banner" hidden>
        <div class="hint-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="16" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12.01" y2="8" />
          </svg>
        </div>
        <div class="hint-text">
          <span class="hint-title" data-i18n="hintTitle"></span>
          <span class="hint-body" data-i18n="hintBody"></span>
        </div>
        <button type="button" class="hint-close" id="btn-hint-close" data-i18n-title="hintDismiss">
          <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18" /><line x1="18" y1="6" x2="6" y2="18" /></svg>
        </button>
      </div>

      <section class="group">
        <h2 class="group-title" data-i18n="groupFormat"></h2>
        <div class="card">
          <div class="row row-stack">
            <div class="row-head">
              <span class="row-title" data-i18n="outputFormat"></span>
              <span class="row-caption" id="format-hint"></span>
            </div>
            <div class="segmented" id="format-seg" role="radiogroup">
              <div class="segmented-thumb" id="format-thumb"></div>
              <button type="button" data-val="jpg">JPG</button>
              <button type="button" data-val="png">PNG</button>
              <button type="button" data-val="webp">WebP</button>
              <button type="button" data-val="avif">AVIF</button>
            </div>
          </div>

          <div class="row row-stack" id="quality-row">
            <div class="row-head">
              <span class="row-title" data-i18n="quality"></span>
              <span class="row-value" id="quality-val">90%</span>
            </div>
            <input type="range" id="quality-range" min="50" max="100" step="1" value="90" />
          </div>
        </div>
      </section>

      <section class="group">
        <h2 class="group-title" data-i18n="groupSize"></h2>
        <div class="card">
          <div class="row">
            <div class="row-text">
              <span class="row-title" data-i18n="widthTitle"></span>
              <span class="row-caption" data-i18n="widthCaption"></span>
            </div>
            <div class="stepper">
              <button type="button" class="step-btn" id="w-minus">−</button>
              <div class="step-value">
                <input type="number" id="width-input" min="64" max="10000" value="1024" />
                <span class="step-unit">px</span>
              </div>
              <button type="button" class="step-btn" id="w-plus">+</button>
            </div>
          </div>

          <div class="row">
            <div class="row-text">
              <span class="row-title" data-i18n="noUpscaleTitle"></span>
              <span class="row-caption" data-i18n="noUpscaleCaption"></span>
            </div>
            <label class="switch">
              <input type="checkbox" id="no-upscale" />
              <span class="track"><span class="thumb"></span></span>
            </label>
          </div>

          <div class="row">
            <div class="row-text">
              <span class="row-title" data-i18n="deleteOrigTitle"></span>
              <span class="row-caption" data-i18n="deleteOrigCaption"></span>
            </div>
            <label class="switch">
              <input type="checkbox" id="delete-originals" />
              <span class="track"><span class="thumb"></span></span>
            </label>
          </div>
        </div>
      </section>

      <section class="group">
        <h2 class="group-title" data-i18n="groupInterface"></h2>
        <div class="card">
          <div class="row">
            <div class="row-text">
              <span class="row-title" data-i18n="notifTitle"></span>
              <span class="row-caption" data-i18n="notifCaption"></span>
            </div>
            <label class="switch">
              <input type="checkbox" id="show-notifications" />
              <span class="track"><span class="thumb"></span></span>
            </label>
          </div>

          <div class="row">
            <span class="row-title" data-i18n="languageTitle"></span>
            <div class="segmented segmented-3 segmented-compact" id="lang-seg" role="radiogroup">
              <div class="segmented-thumb" id="lang-thumb"></div>
              <button type="button" data-val="auto" data-i18n="auto"></button>
              <button type="button" data-val="ru">RU</button>
              <button type="button" data-val="en">EN</button>
            </div>
          </div>

          <div class="row row-stack">
            <div class="row-head">
              <span class="row-title" data-i18n="themeTitle"></span>
            </div>
            <div class="segmented segmented-3" id="theme-seg" role="radiogroup">
              <div class="segmented-thumb" id="theme-thumb"></div>
              <button type="button" data-val="system" data-i18n="auto"></button>
              <button type="button" data-val="light" data-i18n="themeLight"></button>
              <button type="button" data-val="dark" data-i18n="themeDark"></button>
            </div>
          </div>
        </div>
      </section>

      <p class="footnote" id="config-path"></p>
      </div>
    </main>

    <div class="autosave-toast" id="toast">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span data-i18n="saved"></span>
    </div>
  </div>
</div>

<script>
const STATE = __INITIAL_STATE__;
const config = STATE.config;
if (!config.language) config.language = "auto";
config.hint_dismissed = Boolean(config.hint_dismissed);

const I18N = {
  ru: {
    settings: "Настройки",
    minimize: "Свернуть",
    close: "Закрыть",
    hintTitle: "Как пользоваться",
    hintBody: "Нажмите ПКМ по одному или нескольким фото в проводнике → «Сжать с ImageResizerJ».",
    hintDismiss: "Скрыть подсказку",
    groupFormat: "Формат и качество",
    outputFormat: "Формат сохранения",
    quality: "Качество сжатия",
    groupSize: "Размер и файлы",
    widthTitle: "Ширина изображения",
    widthCaption: "Высота подбирается пропорционально",
    noUpscaleTitle: "Не увеличивать маленькие",
    noUpscaleCaption: "Пропускать ресайз, если фото уже́ заданной ширины",
    deleteOrigTitle: "Удалять оригиналы",
    deleteOrigCaption: "Если выключено — сохраняется копия рядом",
    groupInterface: "Интерфейс",
    notifTitle: "Уведомления о завершении",
    notifCaption: "Всплывающая карточка в правом нижнем углу",
    languageTitle: "Язык интерфейса",
    themeTitle: "Тема оформления",
    auto: "Авто",
    themeLight: "Светлая",
    themeDark: "Тёмная",
    saved: "Сохранено",
    hints: {
      jpg:  "Максимальная совместимость",
      png:  "Без потерь, сохраняет прозрачность",
      webp: "Быстро и компактно, с прозрачностью",
      avif: "Минимальный размер, медленнее"
    }
  },
  en: {
    settings: "Settings",
    minimize: "Minimize",
    close: "Close",
    hintTitle: "How to use",
    hintBody: "Right-click one or more images in your file manager → \"Compress with ImageResizerJ\".",
    hintDismiss: "Hide tip",
    groupFormat: "Format & Quality",
    outputFormat: "Output format",
    quality: "Compression quality",
    groupSize: "Size & Files",
    widthTitle: "Image width",
    widthCaption: "Height scales proportionally",
    noUpscaleTitle: "Don't upscale smaller",
    noUpscaleCaption: "Skip resize if image is narrower than target",
    deleteOrigTitle: "Delete originals",
    deleteOrigCaption: "When off, saves a copy alongside",
    groupInterface: "Interface",
    notifTitle: "Completion notifications",
    notifCaption: "Popup card in the bottom-right corner",
    languageTitle: "Language",
    themeTitle: "Appearance",
    auto: "Auto",
    themeLight: "Light",
    themeDark: "Dark",
    saved: "Saved",
    hints: {
      jpg:  "Maximum compatibility",
      png:  "Lossless, preserves transparency",
      webp: "Fast & compact, with transparency",
      avif: "Smallest size, slower encoding"
    }
  }
};

const titlebar = document.getElementById("titlebar");
const contentInner = document.getElementById("content-inner");
const hintBanner = document.getElementById("hint-banner");
const btnHintClose = document.getElementById("btn-hint-close");
const formatButtons = [...document.querySelectorAll("#format-seg button")];
const langButtons = [...document.querySelectorAll("#lang-seg button")];
const themeButtons = [...document.querySelectorAll("#theme-seg button")];
const formatThumb = document.getElementById("format-thumb");
const langThumb = document.getElementById("lang-thumb");
const themeThumb = document.getElementById("theme-thumb");
const formatHint = document.getElementById("format-hint");
const qualityRow = document.getElementById("quality-row");
const qualityRange = document.getElementById("quality-range");
const qualityVal = document.getElementById("quality-val");
const widthInput = document.getElementById("width-input");
const noUpscale = document.getElementById("no-upscale");
const deleteOrig = document.getElementById("delete-originals");
const showNotif = document.getElementById("show-notifications");
const toastEl = document.getElementById("toast");

const cfgEl = document.getElementById("config-path");
cfgEl.textContent = STATE.config_path;
cfgEl.title = STATE.config_path;

let readySent = false;
let lastHeight = 0;

function resolvedLang() {
  const raw = config.language === "auto" ? STATE.system_language : config.language;
  return raw === "ru" ? "ru" : "en";
}

function measureHeight() {
  return Math.ceil(titlebar.offsetHeight + contentInner.offsetHeight + 32);
}

function syncHeight() {
  if (!readySent) return;
  const h = measureHeight();
  if (h !== lastHeight) {
    lastHeight = h;
    window.ipc.postMessage(JSON.stringify({ type: "resize", height: h }));
  }
}

titlebar.addEventListener("mousedown", (e) => {
  if (e.button === 0 && !e.target.closest("button")) {
    window.ipc.postMessage(JSON.stringify({ type: "drag" }));
  }
});
document.getElementById("btn-min").addEventListener("click", () => {
  window.ipc.postMessage(JSON.stringify({ type: "minimize" }));
});
function closeWindow() {
  const parsed = Math.max(64, Math.min(10000, Math.round(Number(widthInput.value)) || config.target_width));
  if (parsed !== config.target_width) {
    config.target_width = parsed;
    window.ipc.postMessage(JSON.stringify({ type: "save", config }));
  }
  window.ipc.postMessage(JSON.stringify({ type: "close" }));
}

document.getElementById("btn-close").addEventListener("click", closeWindow);
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeWindow();
  }
});

let toastTimer = null;
function showSaved() {
  toastEl.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("visible"), 1300);
}

function saveConfig() {
  window.ipc.postMessage(JSON.stringify({ type: "save", config }));
  showSaved();
}

function updateQualitySlider() {
  const min = Number(qualityRange.min);
  const max = Number(qualityRange.max);
  const pct = ((config.quality - min) / (max - min)) * 100;
  qualityRange.value = config.quality;
  qualityRange.style.setProperty("--fill-pos", pct + "%");
  qualityVal.textContent = config.quality + "%";
}

function applyTranslations() {
  const lang = resolvedLang();
  const t = I18N[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.dataset.i18n;
    if (key in t) el.textContent = t[key];
  });
  document.querySelectorAll("[data-i18n-title]").forEach((el) => {
    const key = el.dataset.i18nTitle;
    if (key in t) el.title = t[key];
  });
  formatHint.textContent = t.hints[config.format] || "";
}

function applyUI() {
  applyTranslations();
  hintBanner.hidden = config.hint_dismissed;

  const fIdx = Math.max(0, formatButtons.findIndex(b => b.dataset.val === config.format));
  formatButtons.forEach((b, i) => b.setAttribute("aria-checked", i === fIdx ? "true" : "false"));
  formatThumb.style.transform = `translateX(${fIdx * 100}%)`;
  qualityRow.classList.toggle("row-disabled", config.format === "png");

  const lIdx = Math.max(0, langButtons.findIndex(b => b.dataset.val === config.language));
  langButtons.forEach((b, i) => b.setAttribute("aria-checked", i === lIdx ? "true" : "false"));
  langThumb.style.transform = `translateX(${lIdx * 100}%)`;

  const tIdx = Math.max(0, themeButtons.findIndex(b => b.dataset.val === config.theme));
  themeButtons.forEach((b, i) => b.setAttribute("aria-checked", i === tIdx ? "true" : "false"));
  themeThumb.style.transform = `translateX(${tIdx * 100}%)`;
  if (config.theme === "system") {
    document.documentElement.removeAttribute("data-theme");
  } else {
    document.documentElement.dataset.theme = config.theme;
  }

  widthInput.value = config.target_width;
  noUpscale.checked = config.no_upscale;
  deleteOrig.checked = config.delete_originals;
  showNotif.checked = config.show_notifications;
  updateQualitySlider();
}

btnHintClose.addEventListener("click", () => {
  config.hint_dismissed = true;
  hintBanner.hidden = true;
  saveConfig();
  syncHeight();
});

formatButtons.forEach(btn => btn.addEventListener("click", () => {
  config.format = btn.dataset.val;
  applyUI();
  saveConfig();
  syncHeight();
}));

langButtons.forEach(btn => btn.addEventListener("click", () => {
  config.language = btn.dataset.val;
  applyUI();
  saveConfig();
  syncHeight();
}));

themeButtons.forEach(btn => btn.addEventListener("click", () => {
  config.theme = btn.dataset.val;
  applyUI();
  saveConfig();
}));

qualityRange.addEventListener("input", () => {
  config.quality = Number(qualityRange.value);
  updateQualitySlider();
});
qualityRange.addEventListener("change", saveConfig);

function setWidth(val) {
  config.target_width = Math.max(64, Math.min(10000, Math.round(val) || 1024));
  widthInput.value = config.target_width;
  saveConfig();
}
document.getElementById("w-minus").addEventListener("click", () => setWidth(config.target_width - 128));
document.getElementById("w-plus").addEventListener("click", () => setWidth(config.target_width + 128));
widthInput.addEventListener("change", () => setWidth(Number(widthInput.value)));

noUpscale.addEventListener("change", () => { config.no_upscale = noUpscale.checked; saveConfig(); });
deleteOrig.addEventListener("change", () => { config.delete_originals = deleteOrig.checked; saveConfig(); });
showNotif.addEventListener("change", () => { config.show_notifications = showNotif.checked; saveConfig(); });

applyUI();

setTimeout(() => {
  lastHeight = measureHeight();
  readySent = true;
  window.ipc.postMessage(JSON.stringify({ type: "ready", height: lastHeight }));
}, 0);
</script>
</body>
</html>
